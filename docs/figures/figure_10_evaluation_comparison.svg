  <!-- Summary Callout -->
  <rect x="850" y="865" width="680" height="165" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="870" y="895" font-size="13" font-weight="700" fill="#1F3A5F">Summary of Architectural Advancements:</text>
  <text x="870" y="920" font-size="12" fill="#0F172A">• While a standard LLM terminates its responsibility at generating conversational text,</text>
  <text x="870" y="940" font-size="12" fill="#1F3A5F">  DesktopPilot AI treats user requests as obligations to produce verified filesystem artifacts.</text>
  <text x="870" y="965" font-size="12" fill="#0F172A">• Structural validation ensures that format omissions, empty rows, or corrupt layouts are</text>
  <text x="870" y="985" font-size="12" fill="#0F172A">  detected programmatically and corrected autonomously before delivery.</text>
  <text x="870" y="1010" font-size="11" font-weight="600" fill="#1D7A6E">• All 7 capability dimensions reflect implemented modules in `desktop_pilot/` codebase.</text>
