  <text x="710" y="895" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">PASS</text>

  <rect x="70" y="960" width="710" height="70" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
