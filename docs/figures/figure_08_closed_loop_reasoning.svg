<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" style="background:#FFFFFF; font-family:'Segoe UI', Inter, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803D"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C23B22"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <rect x="0" y="0" width="1600" height="70" fill="#1F3A5F"/>
  <text x="50" y="44" font-size="22" font-weight="700" fill="#FFFFFF">DesktopPilot AI — Closed-Loop Reasoning &amp; Self-Correction Architecture</text>
  <text x="1550" y="44" font-size="14" font-weight="500" fill="#93C5FD" text-anchor="end">Failure Detection &amp; Autonomous Replanning Cycle</text>

  <!-- TOP FORWARD PIPELINE (Left to Right) -->
  <rect x="70" y="100" width="1480" height="230" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="70" y="100" width="360" height="30" rx="4" fill="#1F3A5F"/>
  <text x="85" y="120" font-size="13" font-weight="700" fill="#FFFFFF">FORWARD EXECUTION PIPELINE</text>

  <!-- Node 1: User Request -->
  <rect x="95" y="150" width="220" height="150" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="95" y="150" width="220" height="26" rx="4" fill="#334155"/>
  <text x="110" y="168" font-size="12" font-weight="700" fill="#FFFFFF">1. Task Intake</text>
  <text x="110" y="198" font-size="13" font-weight="700" fill="#1F3A5F">User Request</text>
  <text x="110" y="220" font-size="11" fill="#475569">• Natural-language goal</text>
  <text x="110" y="240" font-size="11" fill="#475569">• Supervisor classification</text>
  <text x="110" y="260" font-size="11" fill="#475569">• Requirement analysis</text>

  <line x1="315" y1="225" x2="365" y2="225" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2: Planning Agent -->
  <rect x="365" y="150" width="265" height="150" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="365" y="150" width="265" height="26" rx="4" fill="#1F3A5F"/>
  <text x="380" y="168" font-size="12" font-weight="700" fill="#FFFFFF">2. Goal Decomposition</text>
  <text x="380" y="198" font-size="13" font-weight="700" fill="#1F3A5F">Planning Agent</text>
  <text x="380" y="220" font-size="11" fill="#475569">• Emits JSON PlanStep[]</text>
  <text x="380" y="240" font-size="11" fill="#475569">• Selects agent &amp; parameters</text>
  <text x="380" y="260" font-size="11" fill="#475569">• Reads replan_reason if active</text>

  <line x1="630" y1="225" x2="680" y2="225" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3: Task Coordinator -->
  <rect x="680" y="150" width="240" height="150" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="680" y="150" width="240" height="26" rx="4" fill="#334155"/>
  <text x="695" y="168" font-size="12" font-weight="700" fill="#FFFFFF">3. Dispatch</text>
  <text x="695" y="198" font-size="13" font-weight="700" fill="#1F3A5F">Task Coordinator</text>
  <text x="695" y="220" font-size="11" fill="#475569">• Sequences plan steps</text>
  <text x="695" y="240" font-size="11" fill="#475569">• Routes to active agent</text>
  <text x="695" y="260" font-size="11" fill="#475569">• Sets target_agent</text>

  <line x1="920" y1="225" x2="970" y2="225" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 4: Execution Agent & Tool -->
  <rect x="970" y="150" width="260" height="150" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="970" y="150" width="260" height="26" rx="4" fill="#1F3A5F"/>
  <text x="985" y="168" font-size="12" font-weight="700" fill="#FFFFFF">4. Tool Execution</text>
  <text x="985" y="198" font-size="13" font-weight="700" fill="#1F3A5F">Execution Agent</text>
  <text x="985" y="220" font-size="11" fill="#475569">• Document / Desktop / Browser</text>
  <text x="985" y="240" font-size="11" fill="#475569">• Invokes native python tools</text>
  <text x="985" y="260" font-size="11" fill="#475569">• Emits output file on disk</text>

  <line x1="1230" y1="225" x2="1280" y2="225" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 5: Physical Output Artifact -->
  <rect x="1280" y="150" width="250" height="150" rx="6" fill="#E6F4F1" stroke="#1D7A6E" stroke-width="1.2"/>
  <rect x="1280" y="150" width="250" height="26" rx="4" fill="#1D7A6E"/>
  <text x="1295" y="168" font-size="12" font-weight="700" fill="#FFFFFF">5. Generated Output</text>
  <text x="1295" y="198" font-size="13" font-weight="700" fill="#1D7A6E">Physical File Artifact</text>
  <text x="1295" y="220" font-size="11" fill="#0F172A">• .docx, .xlsx, .pptx</text>
  <text x="1295" y="240" font-size="11" fill="#0F172A">• Stored in workspace directory</text>
  <text x="1295" y="260" font-size="11" fill="#0F172A">• Target for inspection</text>

  <!-- Flow Down to Validation -->
  <line x1="1405" y1="300" x2="1405" y2="380" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CENTRAL VALIDATION & DECISION NODE -->
  <rect x="70" y="380" width="1480" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="70" y="380" width="400" height="30" rx="4" fill="#1D7A6E"/>
  <text x="85" y="400" font-size="13" font-weight="700" fill="#FFFFFF">6. INDEPENDENT PHYSICAL ARTIFACT VALIDATION</text>

  <rect x="95" y="425" width="600" height="135" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="115" y="450" font-size="14" font-weight="700" fill="#1D7A6E">Validation Agent (validation_agent.py)</text>
  <text x="115" y="475" font-size="12" fill="#0F172A">• Does NOT rely on execution exit code — inspects actual file contents</text>
  <text x="115" y="495" font-size="12" fill="#475569">• Checks file existence &amp; non-zero file size (os.path.getsize(path) &gt; 0)</text>
  <text x="115" y="515" font-size="12" fill="#475569">• DOCX: Checks len(doc.paragraphs) &gt; 1 &amp; non-empty body text</text>
  <text x="115" y="535" font-size="12" fill="#475569">• XLSX: Checks ws.max_row &gt; 1 (headers + data rows present)</text>
  <text x="115" y="555" font-size="12" fill="#475569">• PPTX: Checks len(prs.slides) &gt; 0 &amp; shapes contain non-placeholder text</text>

  <!-- Decision Fork -->
  <!-- PASS BRANCH -->
  <rect x="735" y="425" width="370" height="135" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
  <text x="755" y="452" font-size="15" font-weight="700" fill="#15803D">DECISION: VALIDATION PASS</text>
  <text x="755" y="478" font-size="12" fill="#0F172A">• validation_result = &#123;"valid": True&#125;</text>
  <text x="755" y="498" font-size="12" fill="#0F172A">• Increments current_step</text>
  <text x="755" y="518" font-size="12" fill="#0F172A">• Clears ephemeral task state on final step</text>
  <text x="755" y="538" font-size="12" fill="#0F172A">• Emits final file path &amp; completion message</text>

  <line x1="1105" y1="492" x2="1175" y2="492" stroke="#15803D" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Success Terminal Box -->
  <rect x="1175" y="425" width="355" height="135" rx="6" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>
  <text x="1195" y="452" font-size="14" font-weight="700" fill="#1F3A5F">Session Memory &amp; Delivery</text>
  <text x="1195" y="478" font-size="12" fill="#475569">• Persist turn to SQLite sessions</text>
  <text x="1195" y="498" font-size="12" fill="#475569">• Write audit log to execution_logs</text>
  <text x="1195" y="518" font-size="12" fill="#15803D">• Deliver validated file to User</text>
  <text x="1195" y="538" font-size="11" font-weight="700" fill="#15803D">STATUS: COMPLETED (Success)</text>


  <!-- BOTTOM REPLANNING LOOP (Right to Left Feedback) -->
  <rect x="70" y="610" width="1480" height="360" rx="8" fill="#FFF5F5" stroke="#C23B22" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="70" y="610" width="450" height="30" rx="4" fill="#C23B22"/>
  <text x="85" y="630" font-size="13" font-weight="700" fill="#FFFFFF">SELF-CORRECTION &amp; CYCLIC REPLANNING FEEDBACK LOOP</text>

  <!-- Step F1: Failure Diagnosis -->
  <rect x="1115" y="660" width="415" height="280" rx="6" fill="#FFFFFF" stroke="#C23B22" stroke-width="1.2"/>
  <rect x="1115" y="660" width="415" height="26" rx="4" fill="#C23B22"/>
  <text x="1130" y="678" font-size="12" font-weight="700" fill="#FFFFFF">F1. Failure Diagnosis &amp; State Annotation</text>
  <text x="1130" y="708" font-size="13" font-weight="700" fill="#C23B22">Validation Fails:</text>
  <text x="1130" y="730" font-size="12" fill="#0F172A">• Example: Word doc contains only title</text>
  <text x="1130" y="750" font-size="12" fill="#0F172A">• Example: Excel has header but 0 data rows</text>
  <text x="1130" y="770" font-size="12" fill="#0F172A">• Example: PowerPoint has 0 slides</text>
  <text x="1130" y="805" font-size="13" font-weight="700" fill="#1F3A5F">Generated Failure Message:</text>
  <text x="1130" y="828" font-size="11" fill="#C23B22">failure_msg = "Word doc generated successfully</text>
  <text x="1130" y="846" font-size="11" fill="#C23B22">but contains no meaningful text content..."</text>
  <text x="1130" y="878" font-size="12" font-weight="700" fill="#1F3A5F">Populates in AgentState:</text>
  <text x="1130" y="900" font-size="11" fill="#0F172A">replan_reason = failure_msg</text>
  <text x="1130" y="920" font-size="11" fill="#0F172A">execution_trace.append(&#123;"status": "error"&#125;)</text>

  <!-- Arrow F1 -> F2 -->
  <line x1="1115" y1="800" x2="1055" y2="800" stroke="#C23B22" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <!-- Step F2: LangGraph Cyclic Edge -->
  <rect x="675" y="660" width="380" height="280" rx="6" fill="#FFFFFF" stroke="#C23B22" stroke-width="1.2"/>
  <rect x="675" y="660" width="380" height="26" rx="4" fill="#C23B22"/>
  <text x="690" y="678" font-size="12" font-weight="700" fill="#FFFFFF">F2. LangGraph Cyclic Routing (workflow.py)</text>
  <text x="690" y="708" font-size="13" font-weight="700" fill="#1F3A5F">route_after_validation() Logic:</text>
  <rect x="690" y="725" width="350" height="75" rx="4" fill="#FEE2E2"/>
  <text x="700" y="745" font-size="11" font-family="monospace" fill="#C23B22">if state.get("replan_reason"):</text>
  <text x="720" y="765" font-size="11" font-family="monospace" fill="#C23B22">return "planning_agent"</text>
  <text x="700" y="785" font-size="11" font-family="monospace" fill="#0F172A"># Bypasses Requirement Analyzer</text>

  <text x="690" y="825" font-size="12" font-weight="700" fill="#1F3A5F">Key Architectural Advantage:</text>
  <text x="690" y="845" font-size="11" fill="#475569">• Only downstream planning and execution are redone</text>
  <text x="690" y="865" font-size="11" fill="#475569">• Does not restart entire conversational intake</text>
  <text x="690" y="885" font-size="11" fill="#475569">• Keeps replanning loop fast and computationally cheap</text>
  <text x="690" y="915" font-size="11" font-weight="700" fill="#C23B22">Bounded Retries: Terminates after max attempts</text>

  <!-- Arrow F2 -> F3 -->
  <line x1="675" y1="800" x2="615" y2="800" stroke="#C23B22" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <!-- Step F3: Corrective Prompting & Re-Execution -->
  <rect x="215" y="660" width="400" height="280" rx="6" fill="#FFFFFF" stroke="#C23B22" stroke-width="1.2"/>
  <rect x="215" y="660" width="400" height="26" rx="4" fill="#1F3A5F"/>
  <text x="230" y="678" font-size="12" font-weight="700" fill="#FFFFFF">F3. Corrective Replanning &amp; Re-Execution</text>
  <text x="230" y="708" font-size="13" font-weight="700" fill="#1F3A5F">Planner Prompt Ingestion (planning_agent.py):</text>
  <rect x="230" y="725" width="370" height="75" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="240" y="745" font-size="11" font-family="monospace" fill="#1F3A5F">user_msg += (</text>
  <text x="255" y="765" font-size="11" font-family="monospace" fill="#C23B22">  "\nCRITICAL REPLAN REASON:\n"</text>
  <text x="255" y="785" font-size="11" font-family="monospace" fill="#C23B22">  + replan_reason)</text>

  <text x="230" y="825" font-size="12" font-weight="700" fill="#1F3A5F">Corrective Action:</text>
  <text x="230" y="845" font-size="11" fill="#475569">• LLM generates new plan specifically addressing failure</text>
  <text x="230" y="865" font-size="11" fill="#475569">• Document Agent regenerates file with complete content</text>
  <text x="230" y="885" font-size="11" fill="#475569">• Re-enters Validation Agent for second verification</text>
  <text x="230" y="915" font-size="11" font-weight="700" fill="#15803D">Outcome: Closed-loop self-healing verified</text>

  <!-- Complete cyclic loop line back to Top Planning Node around left margin -->
  <path d="M 215 800 L 35 800 L 35 225 L 355 225" fill="none" stroke="#C23B22" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <rect x="15" y="470" width="40" height="150" rx="4" fill="#FEE2E2" stroke="#C23B22" stroke-width="1"/>
  <text x="38" y="545" font-size="10" font-weight="700" fill="#C23B22" text-anchor="middle" transform="rotate(-90 38 545)">CYCLIC REPLAN</text>
</svg>